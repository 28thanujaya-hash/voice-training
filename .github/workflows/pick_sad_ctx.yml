name: Pick human sad context
on:
  workflow_dispatch:
    inputs:
      out: { description: 'output folder in the repo', required: true }
      n: { description: 'how many clips', default: '3' }
      emo: { description: 'CREMA-D emotion codes, space separated (SAD HAP ANG NEU)', default: 'SAD' }
permissions: { contents: write }
jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get -qq install -y ffmpeg >/dev/null && pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q transformers==4.57.6 librosa soundfile pandas pyarrow
      - run: for e in ${{ inputs.emo }}; do python tools/judge/pick_sad_ctx.py "${{ inputs.out }}" "${{ inputs.n }}" $e; done
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add "${{ inputs.out }}" && git commit -q -m "Human emotion context picks: ${{ inputs.out }} [skip ci]" && git pull -q --rebase && git push -q
