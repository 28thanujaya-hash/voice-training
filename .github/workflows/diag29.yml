name: run29 diagnosis (CPU)
# Why run29b lost every take, tested on a free CPU machine (tools/diag/run29_diag.py). Commits results/diag29/.
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: sudo apt-get install -y -q ffmpeg >/dev/null
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q 'transformers==4.57.6' snac librosa soundfile accelerate
      - run: python -u tools/diag/run29_diag.py
      - if: always()
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add results/diag29 && git commit -q -m "run29 diagnosis (CPU) [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done
