name: Kaggle run
# Starts a Kaggle notebook (kaggle/jobs/<job>/run.py) on Kaggle's free GPU, or collects its results.
# Secrets: KAGGLE_USERNAME + KAGGLE_KEY (kaggle.json), or KAGGLE_API_TOKEN (newer single token).
# action=start  : pushes the job and returns (Kaggle keeps running for up to 12 h without us).
# action=collect: checks (or waits up to 'wait' minutes) until it has finished, downloads the outputs, and commits the small
#                 ones (report, listening pack, logs) to results/<job>/ so Claude can read them.
on:
  workflow_dispatch:
    inputs:
      job: { description: 'job folder under kaggle/jobs', required: true, default: 'hello' }
      action: { description: 'start or collect', required: true, default: 'start' }
      gpu: { description: 'T4 (two T4s), P100, or none', required: false, default: 'T4' }
      wait: { description: 'collect: minutes to wait for the job (1 = check once; saves Actions minutes)', required: false, default: '1' }
permissions:
  contents: write
jobs:
  kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      JOB: ${{ inputs.job }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Kaggle login check
        run: |
          pip install -q --upgrade kaggle six
          if [ -z "$KAGGLE_KEY" ] && [ -z "$KAGGLE_API_TOKEN" ]; then echo "::error::No Kaggle secret set"; exit 1; fi
          [ -z "$KAGGLE_KEY" ] && unset KAGGLE_KEY
          [ -z "$KAGGLE_API_TOKEN" ] && unset KAGGLE_API_TOKEN
          kaggle --version
          kaggle kernels list --mine --page-size 5 || { echo "::error::Kaggle login failed"; exit 1; }
          U="$KAGGLE_USERNAME"
          if [ -z "$U" ]; then U=$(python -c "
          from kaggle.api.kaggle_api_extended import KaggleApi
          a=KaggleApi(); a.authenticate()
          u=a.get_config_value('username') or ''
          if not u:
              try: u=a.get_current_user().username
              except Exception: pass
          print(u or '')" 2>/dev/null | tail -1); fi
          [ -z "$U" ] && U=$(kaggle config view 2>/dev/null | awk -F': ' '/username/{print $2}' | tr -d ' ')
          echo "Kaggle user: ${U:-(unknown)}"
          if [ -z "$U" ] || [ "$U" = "None" ]; then echo "::error::Could not find the Kaggle username"; exit 1; fi
          echo "KUSER=$U" >> $GITHUB_ENV
      - name: Start
        if: inputs.action == 'start'
        run: |
          [ -z "$KAGGLE_KEY" ] && unset KAGGLE_KEY; [ -z "$KAGGLE_API_TOKEN" ] && unset KAGGLE_API_TOKEN
          SLUG="se-$(echo $JOB | tr '_' '-')"
          mkdir -p /tmp/k && cp kaggle/jobs/$JOB/run.py /tmp/k/run.py
          # Kaggle uploads only run.py: other .py files of the job are packed in front of it and written out at start
          python - <<'PK'
          import base64, glob, os
          job = os.environ["JOB"]; extra = [f for f in glob.glob(f"kaggle/jobs/{job}/*.py") if not f.endswith("/run.py")]
          if extra:
              pre = "import base64 as _b, os as _o\n" + "".join(
                  f"open({os.path.basename(f)!r}, 'wb').write(_b.b64decode({base64.b64encode(open(f, 'rb').read()).decode()!r}))\n" for f in extra)
              body = open("/tmp/k/run.py").read(); open("/tmp/k/run.py", "w").write(pre + body)
              print("packed:", [os.path.basename(f) for f in extra])
          PK
          cp kaggle/jobs/$JOB/sources.json /tmp/k/ 2>/dev/null || true
          GPU="${{ inputs.gpu }}"; EN=true; SHAPE=NvidiaTeslaT4
          case "$GPU" in none) EN=false;; P100) SHAPE=NvidiaTeslaP100;; esac
          python - <<PY
          import json
          m = {"id": "$KUSER/$SLUG", "title": "$SLUG", "code_file": "run.py", "language": "python",
               "kernel_type": "script", "is_private": True, "enable_gpu": "$EN" == "true",
               "enable_internet": True, "dataset_sources": [], "competition_sources": [], "kernel_sources": []}
          if "$EN" == "true": m["machine_shape"] = "$SHAPE"
          import os
          if os.path.exists("/tmp/k/sources.json"):   # outputs of earlier jobs this one reads
              src = json.load(open("/tmp/k/sources.json"))
              m["kernel_sources"] = ["$KUSER/se-" + s.replace("_", "-") for s in src.get("jobs", [])]
              m["dataset_sources"] = src.get("datasets", [])
          json.dump(m, open("/tmp/k/kernel-metadata.json", "w"), indent=1)
          print(m)
          PY
          kaggle kernels push -p /tmp/k
          sleep 20; kaggle kernels status "$KUSER/$SLUG" || true
      - name: Sessions
        if: inputs.action == 'sessions'
        run: |
          [ -z "$KAGGLE_KEY" ] && unset KAGGLE_KEY; [ -z "$KAGGLE_API_TOKEN" ] && unset KAGGLE_API_TOKEN
          for k in $(kaggle kernels list --mine --page-size 40 --sort-by dateRun --csv | tail -n +2 | cut -d, -f1); do
            echo "$k: $(kaggle kernels status "$k" 2>&1 | tail -1)"
          done
      - name: Probe API
        if: inputs.action == 'probe'
        run: |
          [ -z "$KAGGLE_KEY" ] && unset KAGGLE_KEY; [ -z "$KAGGLE_API_TOKEN" ] && unset KAGGLE_API_TOKEN
          pip show kaggle kagglesdk 2>/dev/null | grep -E "Name|Version"
          python - <<'PY'
          import kagglesdk, pkgutil, inspect, importlib
          from kagglesdk.kernels.services import kernels_api_service as m
          for n, c in inspect.getmembers(m, inspect.isclass):
              print(n, [x for x in dir(c) if not x.startswith("_")])
          PY
      - name: Collect
        if: inputs.action == 'collect'
        run: |
          [ -z "$KAGGLE_KEY" ] && unset KAGGLE_KEY; [ -z "$KAGGLE_API_TOKEN" ] && unset KAGGLE_API_TOKEN
          SLUG="se-$(echo $JOB | tr '_' '-')"
          for i in $(seq 1 ${{ inputs.wait || '1' }}); do
            S=$(kaggle kernels status "$KUSER/$SLUG" 2>&1 | tail -1); echo "$(date +%H:%M) $S"
            echo "$S" | grep -qiE 'complete|error|cancel' && break; [ "$i" -lt "${{ inputs.wait || '1' }}" ] && sleep 60
          done
          echo "$S" | grep -qiE 'complete|error|cancel' || { echo "still running: nothing collected"; exit 0; }
          mkdir -p /tmp/out && kaggle kernels output "$KUSER/$SLUG" -p /tmp/out || true
          D=results/$JOB; rm -rf $D; mkdir -p $D
          echo "$S" > $D/status.txt
          # keep only small files (reports, logs, listening packs); big ones stay on Kaggle
          find /tmp/out -type f -size -15M \( -name '*.md' -o -name '*.txt' -o -name '*.json' -o -name '*.log' -o -name '*.mp3' -o -name '*.csv' \) -exec cp {} $D/ \;
          ls -la $D
          git config user.name "kaggle-bot"; git config user.email "actions@github.com"
          git add $D && git commit -m "Kaggle results: $JOB ($S) [skip ci]" && { for i in 1 2 3 4 5; do git pull --rebase -q && git push && break; sleep 5; done; } || echo "nothing new"
