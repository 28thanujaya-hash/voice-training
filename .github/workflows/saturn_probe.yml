name: Saturn probe
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SATURN_TOKEN: ${{ secrets.SATURN_TOKEN }}
      SATURN_BASE_URL: https://app.community.saturnenterprise.io
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q saturn-client ruamel.yaml
      - run: |
          [ -n "$SATURN_TOKEN" ] && echo "token set" || echo "NO TOKEN"
          sc --help || true
          for c in options sizes images list; do echo "== sc $c"; sc $c --help 2>&1 | head -30; done
          python - <<'P'
          import saturn_client, inspect
          print(saturn_client.__file__)
          from saturn_client import SaturnConnection
          c = SaturnConnection()
          print([m for m in dir(c) if not m.startswith('_')])
          import json
          print('OPTIONS keys', list(c.options.keys()) if isinstance(c.options, dict) else c.options)
          for k,v in (c.options.items() if isinstance(c.options, dict) else []):
              print('==', k, json.dumps(v, default=str)[:4000])
          print('USER', json.dumps(c.current_user, default=str)[:1500])
          try: print('USAGE', json.dumps(c.get_user_usage(c.current_user['id']), default=str)[:3000])
          except Exception as e: print('USAGE ERR', e)
          try: print('LIMITS', json.dumps(c.get_all_usage_limits(), default=str)[:3000])
          except Exception as e: print('LIMITS ERR', e)
          try: print('SUB', json.dumps(c.get_org_subscription(c.primary_org['id']), default=str)[:3000])
          except Exception as e: print('SUB ERR', e)
          P
          sc options 2>&1 | head -80
