name: Saturn probe
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SATURN_TOKEN: ${{ secrets.SATURN_TOKEN }}
      SATURN_BASE_URL: https://app.community.saturnenterprise.io
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q saturn-client ruamel.yaml
      - run: |
          [ -n "$SATURN_TOKEN" ] && echo "token set" || echo "NO TOKEN"
          sc --help || true
          for c in options sizes images list; do echo "== sc $c"; sc $c --help 2>&1 | head -30; done
          python - <<'P'
          import saturn_client, inspect
          print(saturn_client.__file__)
          from saturn_client import SaturnConnection
          c = SaturnConnection()
          print([m for m in dir(c) if not m.startswith('_')])
          import json, datetime as dt
          for n,v in c.options['sizes'].items():
              if v.get('gpu'): print('GPU', n, v.get('gpu'), v.get('gpu_type'), v.get('memory'), v.get('price_per_hour'), 'DISABLED:'+v.get('disabled_message','') if v.get('disabled') else 'ok', v.get('cloud'), v.get('capacity_limited'))
          now=dt.datetime.utcnow(); 
          try: print('USAGE', json.dumps(c.get_user_usage(c.current_user['id'], (now-dt.timedelta(days=30)).isoformat(), now.isoformat()), default=str)[:2000])
          except Exception as e: print('USAGE ERR', e)
          print('ORG', json.dumps(c.primary_org, default=str)[:1500])
          P
